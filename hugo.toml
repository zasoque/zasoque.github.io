baseURL = 'https://me.shtelo.org/'
locale = 'ko-kr'
timeZone = 'Asia/Seoul'
enableEmoji = true
title = 'Zasoque'

defaultContentLanguage = "za"

[languages.za]
  languageName = "Zasokese"
  locale = "za-TL"

[module]
  [module.mounts]
    source = 'content'
    target = 'content'
[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
    [markup.goldmark.extensions]
      [markup.goldmark.extensions.extras]
        [markup.goldmark.extensions.extras.mark]
          enable = true
      [markup.goldmark.extensions.passthrough]
        enable = true
        [markup.goldmark.extensions.passthrough.delimiters]
          block = [['\[', '\]'], ['$$', '$$']]
          inline = [['\(', '\)'], ['$', '$']]
  [markup.highlight]
    style = 'darcula'
  [markup.tableOfContents]
    endLevel = 5
    ordered = true
    startLevel = 2
[params]
  math = true
  repository = 'https://github.com/zasoque/zasoque.github.io'
[taxonomies]
  category = 'categories'
